descripcion: |
  **CASA PAREADA DE 4 DORMITORIOS EN MANQUIMAVIDA: ESPACIO, LUZ NATURAL Y LISTA PARA TU FAMILIA**

  Casa pareada de un piso en el sector Manquimavida, Chiguayante Sur, con 60 m² construidos en total (40 m² regularizados y 20 m² no regularizados), 4 dormitorios, 1 baño y 100 m² de terreno. Una vivienda cálida, con interiores en madera y mucha luz natural, pensada para una familia que busca espacio a un precio accesible y con la comodidad de una casa de un solo piso.

  **ESTADO DE LA PROPIEDAD:**

  La casa tiene 60 m² construidos en total: 40 m² regularizados, correspondientes a la construcción original de albañilería y 20 m² de ampliaciones que no están regularizadas en madera. Por esta razón, la propiedad no aplica para subsidio habitacional. Te entregamos todos los antecedentes en la visita.

  **SALA FRONTAL Y ENTRADA CUBIERTA:**

  Al ingresar encuentras una entrada cubierta con piso cerámico, techo de policarbonato y reja perimetral, ideal para recibir visitas, guardar un vehículo o disfrutar del exterior protegido de la lluvia. Desde ahí se accede a una sala frontal con ventanal de vidrio corredero.

  **LIVING Y COMEDOR:**

  Living-comedor amplio, con paredes de madera, piso cerámico, estufa a leña con su chimenea, soporte para televisor y abundante luz natural. Un espacio acogedor para compartir en familia durante todo el año.

  **COCINA Y COMEDOR DE DIARIO:**

  Cocina-comedor de diario con piso cerámico, cocina a gas, cocina a leña, refrigerador, mueblería blanca y mesón, además de espacio para una mesa familiar. Luminosa gracias a su tragaluz.

  **DORMITORIOS:**

  Cuatro dormitorios con paredes revestidas en madera y piso cerámico, con espacio para camas y closets. Ventanas con termopanel y cortinas, para mantener el calor del hogar.

  **BAÑO:**

  Baño con ducha con mampara, lavamanos de pedestal, espejo y piso cerámico.

  **LOGGIA, BODEGA Y ALMACENAJE:**

  Cuenta con loggia y recintos de almacenaje con closets, repisas y luz natural, para guardar todo lo que necesites sin ocupar espacio en la casa.

  **ESTACIONAMIENTO:**

  Garage techado con acceso directo desde la calle.

  **ENERGÍA Y EQUIPAMIENTO:**

  Cuenta con panel solar y termopanel en ventanas. Calefacción a leña y gas licuado en balón.

  **SERVICIOS Y ENTORNO:**

  Agua corriente, alcantarillado, línea telefónica e internet. Admite mascotas. Se ubica en el sector Manquimavida, de Chiguayante Sur. Contribuciones $0: propiedad exenta de impuesto territorial.

  Valor: 1.822 UF (aprox. $75.000.000). Agenda tu visita con Maestría Inmobiliaria y conoce esta casa por dentro.
