descripcion: |
  **TU NUEVO HOGAR EN PENCO: LUMINOSO, CON BALCÓN Y ÁREAS VERDES A TU ALCANCE**

  Departamento de 3 dormitorios, un baño completo y un medio baño, de 60 m², en un edificio de 2021 en el
  sector Puertas de Penco, comuna de Penco. Un hogar luminoso, con balcón, logia y
  un entorno de áreas verdes, quincho y juegos infantiles, a minutos de la playa y
  del centro de Penco.

  **REQUISITOS PARA ARRENDAR:**

  - Sueldo equivalente a 3 veces el valor del arriendo.
  - Contrato de trabajo indefinido.
  - Últimas 6 liquidaciones de sueldo.
  - Últimas 12 cotizaciones de AFP.
  - No tener deudas en Dicom.
  - No se permiten mascotas.

  **LIVING Y COMEDOR:**
  Living y comedor integrados en un solo espacio amplio, con piso cerámico,
  ventanales y cortinas que dejan entrar la luz natural. Conectan directamente con
  el balcón.

  **COCINA:**
  Cocina abierta al comedor, con cocina a gas y muebles de
  madera con cajones y espacio de guardado.

  **LOGIA:**
  Logia independiente con calefón y lavadero, lista para instalar tu lavadora.

  **DORMITORIOS:**
  Tres dormitorios alfombrados con closets empotrados de puertas correderas,
  cómodos y con buena iluminación natural.

  **BAÑOS:**
  Un baño completo con tina, cerámicas decorativas, lavamanos de pedestal e inodoro, y un medio baño para visitas.

  **BALCÓN:**
  Balcón con vista despejada, un lugar perfecto para tomar el café de la mañana o
  descansar al final del día.

  **ESTACIONAMIENTO:**
  Incluye 1 estacionamiento de uso exclusivo.

  **ARRIENDO SEMIAMOBLADO:**
  Disponible también en modalidad semiamoblada, que incluye refrigerador,
  lavadora, mesa con sillas, mueble, cama, velador y sofá. Esta modalidad no está
  incluida en el arriendo sin amoblar.

  **ENTORNO:**
  Edificio de 2021 en un conjunto con áreas verdes, plaza, juegos infantiles,
  quincho, sala de eventos, estacionamientos de visitas y cerco perimetral. Sector
  tranquilo, a minutos de la playa y del centro de Penco.

  **VALOR DEL ARRIENDO:**
  Sin amoblar: $450.000 mensuales. Semiamoblado: $470.000 mensuales. Los gastos
  comunes (aprox. $47.000) son aparte y los paga el arrendatario.

  Agenda tu visita hoy y conoce el que puede ser tu próximo hogar. Atención de
  lunes a sábado de 09:00 a 20:00 hrs.
