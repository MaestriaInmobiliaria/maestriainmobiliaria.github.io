descripcion: |
  **Tu nuevo hogar en Concepción te está esperando.**

  Imagina vivir en una casa cómoda, funcional y con excelente conectividad, donde
  cada espacio ha sido pensado para disfrutar en familia. Esta propiedad
  representa una excelente oportunidad para quienes buscan una vivienda amplia,
  con estacionamientos, patio y gran potencial de valorización.

  **Características:** casa pareada de dos pisos, orientación este, 3 dormitorios,
  1 baño, living y comedor, comedor diario, conexión para lavadora, patio, garaje
  techado y 2 estacionamientos. Admite mascotas. Acceso a internet y teléfono.

  **Living y comedor:** espacios acogedores y funcionales, ideales para compartir
  en familia.

  **Cocina y comedor diario:** la cocina cuenta con una distribución que facilita
  las tareas del hogar, complementada con un cómodo comedor diario.

  **Dormitorios:** tres dormitorios que se adaptan a distintas necesidades —
  familia, oficina en casa o habitación de invitados.

  **Exterior y entorno:** patio y garaje techado, más un sector con juegos
  infantiles, locomoción cercana y excelente conectividad.

  **Importante:** la propiedad presenta ampliaciones en el primer y segundo piso
  que actualmente no se encuentran regularizadas, y requiere una pequeña
  inversión en remodelación. Esto representa una oportunidad para personalizarla
  y aumentar su valor.
