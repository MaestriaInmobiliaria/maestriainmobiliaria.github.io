descripcion: |
  **CASA AMPLIA EN COLLAO: ESPACIO PARA VIVIR EN FAMILIA O HACER CRECER TU PROYECTO**

  Casa aislada de un piso en la Población Ignacio Collao, comuna de Concepción, con 4 dormitorios, 2 baños, 250 m² construidos y 408 m² de terreno. Una vivienda amplia, pensada para la vida en familia, que además cuenta con espacios que permiten adaptarla a un emprendimiento o a una residencia para estudiantes.

  **DORMITORIOS:**
  Cuatro dormitorios con piso flotante y closets, entre ellos un dormitorio principal en suite. Luminosos y con cortinas tipo roller, orientados al norte-poniente.

  **BAÑOS:**
  Dos baños con piso cerámico. El baño principal cuenta con doble lavamanos, espejo amplio y ducha con mampara de vidrio; el segundo incluye ducha y espacio para lavadora.

  **LIVING Y COMEDOR:**
  Living y comedor en un mismo espacio amplio, con piso flotante, chimenea y luz natural, además de un cómodo comedor de diario.

  **COCINA:**
  Cocina independiente con piso cerámico, cocina a gas con campana, abundante mueblería y espacio para refrigerador. Agua caliente por calefón.

  **ESPACIOS ADICIONALES:**
  La propiedad cuenta con amplios recintos adicionales a la vivienda, con electricidad de 220 y 380 volts (trifásica), que ofrecen la posibilidad de desarrollar un negocio o de adaptar la casa como residencia para estudiantes. Se vende como inmueble habitacional; el equipamiento que aparece en las fotografías no está incluido en el valor.

  **PATIO Y JARDÍN:**
  Patio con jardín formado, senderos y pasillo techado con vegetación, ideal para disfrutar al aire libre y circular protegido del clima.

  **ESTACIONAMIENTO Y BODEGA:**
  Estacionamiento techado para 2 vehículos, ubicado en un pasillo cubierto con acceso a la calle, y bodega para guardar lo que necesites.

  **SERVICIOS Y ENTORNO:**
  Agua corriente, alcantarillado, línea telefónica e internet. Sin gastos comunes. Admite mascotas. Se ubica en el sector Collao, de Concepción.

  Valor: 7.986 UF. Agenda tu visita con Maestría Inmobiliaria y descubre todo lo que esta casa tiene para ofrecerte.
