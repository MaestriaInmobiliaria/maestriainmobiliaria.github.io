descripcion: |
  **Vive la tranquilidad y el estilo que mereces.**

  Descubre este moderno y acogedor departamento en el Edificio Parque Lomas,
  ubicado en el 5º piso de uno de los sectores con mayor plusvalía de
  Concepción: Lomas San Sebastián. Ideal para vivir o invertir, combina
  comodidad, funcionalidad y una excelente ubicación.

  **Living-comedor:** amplio espacio integrado con piso flotante y excelente
  iluminación natural.

  **Cocina americana:** moderna y funcional, equipada con encimera, horno
  empotrado, mobiliario moderno y una amplia cubierta tipo comedor diario.

  **Dormitorios:** habitaciones cómodas y luminosas con piso flotante, con
  dormitorio principal en suite.

  **Baños:** 2 baños completos, uno de ellos en suite con tina.

  **Balcón:** amplio balcón con orientación nororiente, ideal para disfrutar del
  sol de la mañana.

  **Incluye:** estacionamiento y bodega.

  **Amenidades del edificio:** conserjería y acceso controlado, gimnasio,
  quincho, salón multiuso y áreas comunes modernas. Pet friendly.

  **Entorno:** excelente conectividad, cercanía al Mall Plaza Trébol, rápido
  acceso al aeropuerto, supermercados, farmacias y múltiples servicios.
