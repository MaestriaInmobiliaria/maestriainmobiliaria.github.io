# PLANTILLA de propiedad. Copia este archivo con el nombre del slug
# (ej. casa-san-pedro-costa-mar.yaml) y quita el guion bajo inicial.
codigo: "0000"                     # codigo Convecta
titulo: "Título comercial de la propiedad"
operacion: venta                   # venta | arriendo
tipo: casa                         # casa | departamento | oficina | local | bodega | terreno | parcela | sitio
estado: disponible                 # disponible | reservada | vendida
destacada: false

precio: 0                          # numero, sin puntos
moneda: UF                         # UF | CLP

comuna: "San Pedro de la Paz"
ciudad: "Concepción"
sector: ""                         # barrio / condominio (opcional)

dormitorios: 0
banos: 0
estacionamientos: 0
superficie_util: 0                 # m2
superficie_terreno: 0             # m2 (0 si no aplica)

caracteristicas:
  - "Logia"
  - "Cocina equipada"

descripcion: |
  Texto largo en Markdown. Se permite **negrita**, listas y párrafos.

fotos:                             # nombres de archivo dentro de data/propiedades/_fotos/<slug>/
  - 01.jpg
  - 02.jpg

agente: jonathan-fox              # slug de data/agentes.yaml
url_convecta: ""                  # link a la publicacion completa (opcional)
lat: null
lng: null
