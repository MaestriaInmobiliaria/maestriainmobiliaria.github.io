descripcion: |
  **Amplitud, comodidad y excelente ubicación en San Pedro de la Costa.**

  Casa de 2 pisos con 4 dormitorios, 2 estacionamientos, bodega y lista para
  habitar. Hay hogares que simplemente se visitan… y otros donde desde el primer
  instante puedes imaginar a tu familia disfrutando cada espacio.

  Esta acogedora casa ubicada en San Pedro de la Costa Etapa 1, San Pedro de la
  Paz, ofrece amplitud, comodidad y una excelente conectividad, siendo una
  alternativa ideal para familias que buscan un lugar seguro y tranquilo. Además,
  la propiedad se encuentra 100% regularizada, acepta subsidio y está lista para
  convertirse en tu próximo hogar.

  **Ubicación estratégica:** vive en uno de los sectores con mayor crecimiento de
  San Pedro de la Paz. Excelente locomoción colectiva, cercana a supermercados,
  colegios y jardines infantiles, áreas verdes, comercio y servicios, centros de
  salud y rápida conexión hacia Concepción y Coronel.

  **Living y comedor:** amplio y cómodo espacio pensado para compartir en familia.

  **Cocina:** cocina independiente, cómoda y funcional, con una distribución que
  facilita el trabajo diario.

  **Dormitorios:** 4 dormitorios con buena iluminación natural, espacio suficiente
  para toda la familia o para sala de estudio y habitación de visitas.

  **Baños:** 2 baños completamente funcionales, con pisos cerámicos.

  **Estacionamiento:** capacidad para 2 vehículos dentro de la propiedad,
  entregando comodidad y mayor seguridad.

  **Bodega:** espacio ideal para guardar herramientas, bicicletas y artículos de
  temporada.

  **Exterior:** espacio exterior ideal para reuniones familiares, juegos
  infantiles o futuros proyectos de ampliación, en un entorno residencial pensado
  para la vida en familia.
