descripcion: |
  Imagina llegar cada tarde a tu propia casa dentro de un condominio cerrado,
  seguro y pensado para la vida en familia. En Brisas de San Pedro, San Pedro de
  la Paz, esta casa de 87 m² construidos, distribuidos en dos pisos, con 3
  dormitorios y 2 baños, ofrece el espacio y la tranquilidad que buscas sin
  salir de la ciudad.

  **Living y comedor:** un espacio integrado y luminoso, con piso porcelanato de
  principio a fin, pensado para compartir en familia o recibir visitas con
  comodidad.

  **Cocina:** cocina integrada con piso porcelanato, agua caliente por calefont y
  conexión a gas cilindro. Suma un comedor de diario junto a la cocina, perfecto
  para los desayunos y almuerzos del día a día.

  **Dormitorios:** 3 dormitorios con piso alfombrado que aportan calidez, más un
  closet. Distribuidos en el segundo piso, garantizan la privacidad de cada
  integrante de la familia.

  **Baños:** 2 baños completos con piso cerámico, con terminaciones simples y
  funcionales para el uso diario.

  **Patio y loggia:** un amplio patio privado de uso y goce exclusivo, ideal para
  tardes al aire libre, asados de fin de semana o para que niños y mascotas
  jueguen sin preocupaciones. Suma una loggia como espacio de transición
  cubierto.

  **Estacionamientos y bodega:** garage con capacidad para 2 vehículos, más un
  estacionamiento adicional para visitas, y una bodega.

  **Condominio y entorno:** condominio cerrado con seguridad 24/7, cerco
  eléctrico, cámaras de vigilancia y conserjería, más áreas con jardines
  formados y juegos infantiles.

  Construida en 2018, esta casa está apta para crédito hipotecario. Agenda tu
  visita y descubre por qué Brisas de San Pedro puede ser el próximo hogar de tu
  familia.
