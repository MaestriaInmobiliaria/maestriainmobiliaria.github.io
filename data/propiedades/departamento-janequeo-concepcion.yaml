descripcion: |
  **Tu espacio ideal en Concepción sí existe… y está en Janequeo.**

  Imagina vivir en un departamento donde la comodidad, la conectividad y la luz
  natural forman parte de tu día a día. Ubicado en el sector Janequeo de
  Concepción, esta propiedad ofrece una excelente oportunidad para quienes buscan
  calidad de vida o una inversión con gran potencial de arriendo.

  Su orientación noroeste permite disfrutar de una agradable iluminación natural
  durante gran parte del día. Cuenta con 1 dormitorio con clóset, 1 baño,
  living-comedor, cocina con conexión para lavadora y balcón. El edificio dispone
  de ascensor, lavandería, sala de estudio, sala de eventos, conserjería, cámaras
  de seguridad y admite mascotas.

  Ubicado estratégicamente cerca de Avenida Paicaví, locomoción colectiva,
  universidades, colegios, supermercados, centros de salud y el Hospital Regional
  de Concepción. Además, se encuentra a pasos de la Laguna Las Tres Pascualas,
  uno de los sectores más valorados de la ciudad.

  **Características:** ubicado en el piso 22, 1 dormitorio, 1 baño, 1 balcón,
  orientación noroeste, año 2016, gastos comunes $60.000 aprox., sin
  estacionamiento y sin bodega.

  Una excelente alternativa para profesionales, estudiantes, parejas jóvenes o
  inversionistas que buscan una propiedad con ubicación privilegiada y alta
  demanda de arriendo.
