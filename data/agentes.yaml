# Equipo de agentes. slug = identificador para enlazar propiedades.
agentes:
  - slug: jonathan-fox
    nombre: "Jonathan Fox"
    cargo: "Director & Corredor de Propiedades"
    email: "ContactoMaestriaInmobiliaria@gmail.com"
    telefono: ""
    whatsapp: ""
    foto: "/img/equipo/jonathan-fox.jpg"
    bio: >-
      Estratega inmobiliario y fundador de Maestría Inmobiliaria, creador del
      Método V.I.E. Advanced para posicionar y vender propiedades en menos de
      90 días, con más de 5 años de experiencia en el Gran Concepción.
    # Landing personal de marca -> /jonathanfox/
    landing:
      url: "jonathanfox"
      eyebrow: "Corredor de Propiedades · Concepción"
      lead: >-
        Director y fundador de Maestría Inmobiliaria. Ayudo a propietarios del
        Gran Concepción a vender su casa o departamento al mejor precio, en
        menos de 90 días, con el Método V.I.E. Advanced que desarrollé para esto.
      wa_text_hero: "Hola Jonathan, quiero conversar sobre la venta de mi propiedad."
      wa_text_cta: "Hola Jonathan, quiero agendar una llamada de asesoría gratuita para vender mi propiedad."
      stats:
        - { valor: "+5", label: "Años de experiencia" }
        - { valor: "90", label: "Días, método de venta" }
        - { valor: "V.I.E.", label: "Método propio Advanced" }
      pilares:
        - titulo: "Método propio, no genérico"
          texto: "El Método V.I.E. Advanced que yo mismo creé para posicionar y vender propiedades en menos de 90 días."
        - titulo: "Evaluación con datos reales"
          texto: "Defino el precio con estudio de mercado y comparables de la zona, no con una corazonada."
        - titulo: "Contacto directo conmigo"
          texto: "Yo coordino tu proceso de principio a fin: evaluación, marketing, visitas, negociación y escritura."
      sobre_mi:
        - >-
          Estratega inmobiliario y fundador de Maestría Inmobiliaria, creador del
          Método V.I.E. Advanced para posicionar y vender propiedades en menos de
          90 días, con más de 5 años de experiencia en el Gran Concepción.
        - "Trabajo con propietarios que quieren vender bien: al mejor precio posible, en un plazo razonable, y sin sorpresas en el camino."
      checklist:
        - "Evaluación comercial de tu propiedad, sin costo"
        - "Estrategia de marketing y fotografía profesional"
        - "Publicación en los principales portales inmobiliarios"
        - "Negociación y acompañamiento hasta la escritura"
        - "Un solo interlocutor durante todo el proceso: yo"

