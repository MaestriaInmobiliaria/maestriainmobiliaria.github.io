        - titulo: "Evaluación con datos reales"
          texto: "Trabajo con estudio de mercado y comparables reales de tu zona para fijar el precio correcto."
        - titulo: "Acompañamiento cercano"
          texto: "Te acompaño desde la primera visita hasta la firma, siempre disponible para tus dudas."
      sobre_mi:
        - "Soy Agente Captadora en Maestría Inmobiliaria. Mi trabajo es detectar el potencial real de cada propiedad y diseñar la estrategia adecuada para venderla, combinando visión comercial y respaldo profesional."
        - "Trabajo siempre cercana al propietario: te explico cada paso del proceso y te mantengo al tanto de los avances hasta el cierre."
      checklist:
        - "Evaluación comercial de tu propiedad, sin costo"
        - "Estrategia de presentación y marketing"
        - "Publicación en los principales portales inmobiliarios"
        - "Coordinación de visitas y seguimiento"
        - "Acompañamiento hasta la firma de la escritura"

